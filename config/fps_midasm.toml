# svr07 high-frame-rate stage 1 (reports/L7-fps-stage1.md): tick carry for the 11 functions that truncate the
# frame-rate block's step (0x8295D1A4 +0x30) with int(step). Each hook sits right after the function's only
# `lfs f0,48(rN)` of the block; the next use of f0 is the fctiwz/fctidz. The hook (src/svr07_fps.cpp,
# Svr07FpsCarry) replaces f0 with this frame's carried whole step (0,1,0,1 at 0.5) only while the step is under 1.0
# and svr07_fps_tick_carry is on; otherwise f0 is left as loaded (the game's own int()). Per site, so no other
# function or thread sees a changed block. Addresses counted from the generated code (checked against every
# loc_/ctx.lr anchor in each function).

