# Hand-written roster-expansion hooks (see docs/ROSTER_EXPANSION.md). The per-site
# `cmp id,93` hooks are generated: config/roster_midasm.toml.

# Select list (sub_822F8C08): each brand/mode loop ends in `cmpw cr6,r31,r28` (id vs 93
# or 123); r23 counts entries. The hook carries the loop on through the extra ids.
[[midasm_hook]]
address = 0x822F8D40
name = "RosterSelectListLoop"
registers = ["cr6", "r31", "r28", "r23"]
after_instruction = true

[[midasm_hook]]
address = 0x822F8DFC
name = "RosterSelectListLoop"
registers = ["cr6", "r31", "r28", "r23"]
after_instruction = true

[[midasm_hook]]
address = 0x822F8E9C
name = "RosterSelectListLoop"
registers = ["cr6", "r31", "r28", "r23"]
after_instruction = true

[[midasm_hook]]
address = 0x822F8F5C
name = "RosterSelectListLoop"
registers = ["cr6", "r31", "r28", "r23"]
after_instruction = true

[[midasm_hook]]
address = 0x822F9018
name = "RosterSelectListLoop"
registers = ["cr6", "r31", "r28", "r23"]
after_instruction = true


# Self-test select picks (svr07_hooks.cpp SelftestSelectPick): after `clrlwi r10,r3,16` = the grid's hovered id,
# at the compare and store into the picks entry (+884, 40-byte entries, id at +16). sub_82307370: r31 select,
# r26 = 40 * player; sub_82308C00: r28.
[[midasm_hook]]
address = 0x8230745C
name = "SelftestSelectPick"
registers = ["r10", "r31", "r26"]
after_instruction = true

[[midasm_hook]]
address = 0x823074AC
name = "SelftestSelectPick"
registers = ["r10", "r31", "r26"]
after_instruction = true

[[midasm_hook]]
address = 0x82307520
name = "SelftestSelectPick"
registers = ["r10", "r31", "r26"]
after_instruction = true

[[midasm_hook]]
address = 0x82307570
name = "SelftestSelectPick"
registers = ["r10", "r31", "r26"]
after_instruction = true

[[midasm_hook]]
address = 0x82308D3C
name = "SelftestSelectPick"
registers = ["r10", "r31", "r28"]
after_instruction = true

# VS screen models (sub_8246A958): after `add r29,r22,r11` = entry r29 for entrant r30, before its id (+16) is read.
[[midasm_hook]]
address = 0x8246AA20
name = "SelftestVsPick"
registers = ["r29", "r30"]
after_instruction = true


# Match-up / preview screen model setup (sub_8246A958): a roster id's model size comes
# from a 93-entry float table, 0x82041C88 + 4 + id*8 (`rlwinm r11,r25,3,0,28`, then lfsx).
# An extra reads its base superstar's entry instead of past the table.
[[midasm_hook]]
address = 0x8246AB24
name = "RosterPreviewSize"
registers = ["r11", "r25"]
after_instruction = true


# Select-panel look (look= in a manifest): at each back_legend02/03 name load the name
# register is swapped for back_<look>02/03 when the panel's id is an extra with a look.
# sub_82324F68 / sub_82319BC0: `addi r5,r11,back_legend02`, id in r30.
[[midasm_hook]]
address = 0x82325030
name = "RosterLook02"
registers = ["r5", "r30"]
after_instruction = true

[[midasm_hook]]
address = 0x82319CA8
name = "RosterLook02"
registers = ["r5", "r30"]
after_instruction = true

