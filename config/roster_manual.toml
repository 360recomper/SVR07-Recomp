# Hand-written roster-expansion hooks (see docs/ROSTER_EXPANSION.md). The per-site
# `cmp id,93` hooks are generated: config/roster_midasm.toml.

# Select list (sub_822F8C08): each brand/mode loop ends in `cmpw cr6,r31,r28` (id vs 93
# or 123); r23 counts entries. The hook carries the loop on through the extra ids.
[[midasm_hook]]
address = 0x822F8D40
name = "RosterSelectListLoop"
registers = ["cr6", "r31", "r28", "r23"]
after_instruction = true

[[midasm_hook]]
address = 0x822F8DFC
name = "RosterSelectListLoop"
registers = ["cr6", "r31", "r28", "r23"]
after_instruction = true

[[midasm_hook]]
address = 0x822F8E9C
name = "RosterSelectListLoop"
registers = ["cr6", "r31", "r28", "r23"]
after_instruction = true

[[midasm_hook]]
address = 0x822F8F5C
name = "RosterSelectListLoop"
registers = ["cr6", "r31", "r28", "r23"]
after_instruction = true

[[midasm_hook]]
address = 0x822F9018
name = "RosterSelectListLoop"
registers = ["cr6", "r31", "r28", "r23"]
after_instruction = true


# Match-up / preview screen model setup (sub_8246A958): a roster id's model size comes
# from a 93-entry float table, 0x82041C88 + 4 + id*8 (`rlwinm r11,r25,3,0,28`, then lfsx).
# An extra reads its base superstar's entry instead of past the table.
[[midasm_hook]]
address = 0x8246AB24
name = "RosterPreviewSize"
registers = ["r11", "r25"]
after_instruction = true
